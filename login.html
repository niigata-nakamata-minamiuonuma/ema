<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン - エリアメール送信システム</title>
    <style>
        body { font-family: sans-serif; background: #222; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #333; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: center; }
        input[type="password"] { width: 100%; padding: 10px; font-size: 16px; margin: 20px 0; border-radius: 4px; border: none; box-sizing: border-box; }
        button { background: #ff3b30; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>⚠️ 管理者ログイン</h2>
        <p>エリアメール送信システムのパスワードを入力してください</p>
        <form action="/login" method="POST">
            <input type="password" name="password" placeholder="パスワードを入力" required>
            <button type="submit">ログイン</button>
        </form>
    </div>
</body>
</html>
